name: Lint

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
jobs:
  Test:
    name: Lint
    # ubuntu-latest (26.04) has no Python 3.9 for setup-python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install poetry
        run: python -m pip install uv

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check --output-format=github .

      - name: Format with ruff
        run: uv run ruff format . --check --diff

      - name: Security check with bandit
        run: uv run bandit -c pyproject.toml -l -r .
