name: Test plugin

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

env:
  DOCKER_IMAGE: qgis/qgis

jobs:
  Test-plugin:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        docker_tags: ["3.44", "4.0-trixie"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker pull QGIS
        run: |
          docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

      - name: Run tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/plugin \
            -w /plugin \
            "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
            sh -c "
              pip3 install --break-system-packages pytest pytest-qgis &&
              xvfb-run -s '+extension GLX -screen 0 1024x768x24' \
                python3 -m pytest tests/ -v
            "

  # COG 変換の成功パスは COG ドライバの INTERLEAVE=BAND (GDAL 3.11+) を要る。
  # qgis/qgis イメージは GDAL 3.10.3 止まりでこのパスを skip してしまうため、
  # QGIS 非依存の GDAL イメージ (3.11+) で cog のテストだけ実行して成功パスを守る。
  Test-cog-modern-gdal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run COG tests on modern GDAL
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/plugin \
            -w /plugin \
            ghcr.io/osgeo/gdal:ubuntu-small-latest \
            sh -c "
              apt-get update -qq && apt-get install -y -qq python3-pytest &&
              python3 -m pytest tests/test_cog.py -v
            "
